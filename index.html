<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: Segoe UI; background: #f3f2f1; }
    #loading { padding: 20px; text-align: center; color: #605e5c; }
    iframe { width: 100%; height: 100vh; border: none; display: none; }
  </style>
</head>
<body>
  <div id="loading">Ładowanie...</div>
  <iframe id="appFrame"></iframe>
  <script>
    Office.onReady(function() {
      var itemId = Office.context.mailbox.item.itemId;
      var appUrl = "https://apps.powerapps.com/play/e/default-808439f3-5504-48fd-afe3-c264443f6f12/a/7212ddc7-3e16-4210-8195-75429ff3775a?tenantId=808439f3-5504-48fd-afe3-c264443f6f12&itemId=" + encodeURIComponent(itemId);
      document.getElementById("loading").style.display = "none";
      var frame = document.getElementById("appFrame");
      frame.src = appUrl;
      frame.style.display = "block";
    });
  </script>
</body>
</html>
